[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json_database"
version = "0.10.2a1"
description = "searchable json database with persistence"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.8"
dependencies = [
    "combo_lock>=0.2.1,<1.0.0",
]

[project.optional-dependencies]
crypto = ["pycryptodomex"]
# Back-compat shim for the 1.x line — ``json_database[hpm]`` keeps
# resolving to a working install of the HiveMind database plugin so
# existing ``pip install json_database[hpm]`` users don't break on
# upgrade. The adapter itself was extracted into
# https://github.com/JarbasHiveMind/hivemind-json-db-plugin; this
# extra simply pulls it in transitively so the
# ``hivemind-json-db-plugin`` entry point remains available.
# This extra will be REMOVED in 2.0.0 — migrate to
# ``pip install hivemind-json-db-plugin`` directly.
hpm = ["hivemind-json-db-plugin>=0.0.3a2"]
test = [
    "coveralls>=1.8.2",
    "flake8>=3.7.9",
    "pytest>=5.2.4",
    "pytest-cov>=2.8.1",
    "cov-core>=1.15.0",
    "pycryptodomex",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/json_database"

[tool.setuptools.packages.find]
where = ["."]
include = ["json_database*"]

[tool.setuptools.package-data]
"*" = ["*"]
